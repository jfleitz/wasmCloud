# The component, a Kubernetes Secret, and the binding between them.
#
#   kubectl apply -f http-secrets.yaml
#
# The Secret's keys become the component's `wasmcloud:secrets` config: the
# operator resolves `secretFrom` when it deploys the workload and hands the
# host the decoded key/value pairs as bind-time config, which the host's
# built-in `wasmcloud-secrets` plugin serves back to `store.get` / `reveal`.
# Nothing here is written to a file or an environment variable the component
# can read; a value leaves the host only through `reveal`.
apiVersion: v1
kind: Secret
metadata:
  name: http-secrets
stringData:
  username: alice
  password: hunter2
  # The labeled `api-key` import below is served from this key: for a labeled
  # import the label *is* the config key.
  api-key: 0123-4567-89ab
---
apiVersion: v1
kind: Service
metadata:
  name: http-secrets
spec:
  # No selector on purpose — the operator writes the EndpointSlice, pointing at
  # the host pods that are actually running this workload.
  ports:
    - name: http
      port: 80
      protocol: TCP
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: http-secrets
spec:
  replicas: 1
  template:
    spec:
      hostSelector:
        hostgroup: default
      kubernetes:
        service:
          name: http-secrets
      components:
        - name: http-secrets
          image: ghcr.io/wasmcloud/components/http-secrets:0.1.0
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [incoming-handler]
          config:
            # The hostname the host routes on — what an ingress in front of
            # the Service forwards, and what verify.sh sends. The operator
            # also registers Service DNS aliases for in-cluster callers.
            host: http-secrets.example.com
        # The plain `store`/`reveal` import: every key of the Secret answers
        # `store.get`. `secretFrom` merges like `envFrom` — later Secrets win
        # on a key conflict.
        - namespace: wasmcloud
          package: secrets
          version: "2.1.0"
          interfaces: [store, reveal]
          secretFrom:
            - name: http-secrets
        # The labeled `api-key` import routes here by `name`. Drop the
        # `api-key` key from the Secret and this workload never becomes
        # Ready: the host refuses the bind naming the missing key, before
        # the component is ever instantiated.
        - namespace: wasmcloud
          package: secrets
          version: "2.1.0"
          interfaces: [secret]
          name: api-key
          secretFrom:
            - name: http-secrets
